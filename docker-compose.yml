version: "3.5"
services:

  ngsi-broker:
    image: ghcr.io/opsilab/ngsi-ldbrokermanager:v1.1
    container_name: "ngsi-broker"
    ports:
      - 8082:8082
    environment:
      - SERVER_DEBUG=${SERVER_DEBUG}
      - IDRA_BASE_PATH=${IDRA_BASE_PATH}
      - HOST_ORION=${HOST_ORION}
      - PORT_ORION=${PORT_ORION}
      # Context Broker hosts exempt from the SSRF private-address check.
      - CB_URL_ALLOWLIST=${CB_URL_ALLOWLIST}
    networks:
      - ngsi-broker
      
