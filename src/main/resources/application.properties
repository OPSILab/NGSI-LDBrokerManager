# NGSI-LD Broker Manager Configuration
# All values can be overridden via environment variables (shown as defaults below)
# DEVELOPMENT DEFAULTS - change for production deployment

# Server port - override via SERVER_PORT environment variable
server.port = ${SERVER_PORT:8082}
# Debug mode - override via SERVER_DEBUG environment variable (use false in production)
debug=${SERVER_DEBUG:true}

## IDRA BACKEND CONNECTION ##
# Idra base path - override via IDRA_BASE_PATH environment variable
# Examples: http://idra:8080 (Docker), http://localhost:8080 (local dev)
idra.basepath=${IDRA_BASE_PATH:http://localhost:8080}

## CONTEXT BROKER (ORION) CONNECTION ##
# Context Broker hostname - override via HOST_ORION environment variable
# Examples: orion-ld (Docker service name), localhost (local dev)
contexBroker.host_orion=${HOST_ORION:localhost}
# Context Broker port - override via PORT_ORION environment variable
contexBroker.port_orion= ${PORT_ORION:1026}

# SSRF Protection: Comma-separated Context Broker hostnames exempt from private-address check
# Required for internal Orion brokers on Docker networks (which use private IPs)
# Override via CB_URL_ALLOWLIST environment variable
# Example: CB_URL_ALLOWLIST=orion-ld,orion-ld-SMARTERA-final
contexBroker.url.allowlist=${CB_URL_ALLOWLIST:}